[project]
name = "xiaomi-17t-pro-lab-verification"
version = "3.1.0"
description = "Independent 60-digit Decimal/Fraction physics oracle, Lean axiom auditor, live negative kernel harness, citation auditor, and AMS-LaTeX packager for xiaomi-17t-pro-lab."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
  "reference/physics_oracle.py",
  "scripts/check_readme_axioms.py",
  "scripts/check_repo_integrity.py",
  "scripts/check_citations.py",
  "scripts/test_negative_lean.py",
  "scripts/package_dist.py"
]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
