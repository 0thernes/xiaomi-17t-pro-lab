name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage interactive lab, Lean 4.35.0 Blueprint, and white paper PDF
        run: |
          mkdir -p _site/dist
          cp index.html favicon.svg .nojekyll coi-serviceworker.js _site/
          cp -a styles src vendor assets data blueprint _site/
          if [ -f dist/Donahue_2026_Xiaomi_17T_Pro_Lab.pdf ]; then
            cp dist/Donahue_2026_Xiaomi_17T_Pro_Lab.pdf _site/dist/
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
