name: Release Frozen Artifacts, SHA256SUMS & Build Provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Package & Publish Verified Release Assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify full Node + Python + SHA-256 + integrity suite prior to publishing
        run: |
          npm ci
          npm run verify:all
          npm run evals
          python reference/physics_oracle.py --check-checksums
          python scripts/check_readme_axioms.py
          python scripts/check_repo_integrity.py
      - name: Stage release artifacts and compute SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/Donahue_2026_Xiaomi_17T_Pro_Lab.pdf release-assets/
          cp dist/arxiv_submission.tar.gz release-assets/
          cp results/lean4-audit.txt release-assets/
          cp results/oracle-60digit.json release-assets/
          cp results/tinystories-eval.json release-assets/
          cp results/perf-benchmarks.json release-assets/
          cp results/stats-eval.json release-assets/
          cp results/citation-audit.json release-assets/
          cp CHECKSUMS.sha256 release-assets/
          cp proofs/*.tsr proofs/*.ots proofs/provenance-receipts.json release-assets/ 2>/dev/null || true
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Generate SLSA build provenance attestation for release artifacts
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release-assets/Donahue_2026_Xiaomi_17T_Pro_Lab.pdf
            release-assets/arxiv_submission.tar.gz
            release-assets/lean4-audit.txt
            release-assets/SHA256SUMS
      - name: Create or update GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Xiaomi 17T Pro Lab $TAG" \
              --notes-file CHANGELOG.md
          fi
